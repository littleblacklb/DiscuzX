name: JS Check

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve base ref
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax-check changed JS files
        shell: bash
        run: |
          BASE='${{ steps.base.outputs.ref }}'
          if ! DIFF=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.js'); then
            echo "::error::git diff against '$BASE' failed"
            exit 1
          fi
          FILES=()
          [ -z "$DIFF" ] || mapfile -t FILES <<< "$DIFF"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No JS files changed."
            exit 0
          fi
          echo "Checking ${#FILES[@]} file(s) with $(node --version)"
          fail=0
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || continue
            if ! out=$(node --check "$f" 2>&1); then
              echo "::error file=$f::$(printf '%s\n' "$out" | head -n 1)"
              printf '%s\n' "$out"
              fail=1
            fi
          done
          exit $fail
