name: i18n Parity

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: language keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check language key parity
        run: php scripts/ci/check-i18n-parity.php
